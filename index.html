<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff5f8; font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  /* ── HERO ── */
  .hero {
    background: #fff;
    padding: 52px 24px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
    border-bottom: 3px solid #ff3f8e;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 10% 80%, rgba(255,63,142,0.10) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 20%, rgba(255,165,0,0.10) 0%, transparent 55%);
  }
  .show-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px; letter-spacing: 5px; text-transform: uppercase;
    color: #ff3f8e; margin-bottom: 10px; position: relative; font-weight: 500;
  }
  .chat-name {
    font-family: 'Syne', sans-serif;
    font-size: clamp(42px, 9vw, 80px);
    font-weight: 800; color: #1a1a1a;
    line-height: 1; position: relative; letter-spacing: -1px;
  }
  .divider {
    width: 48px; height: 3px;
    background: linear-gradient(90deg, #ff3f8e, #ff8c00);
    margin: 16px auto; border-radius: 2px; position: relative;
  }
  .tagline {
    font-size: 13px; color: #888; font-style: italic;
    letter-spacing: 0.3px; position: relative;
  }

  /* ── FILTER BAR ── */
  .filter-bar {
    display: flex; gap: 8px; justify-content: center;
    flex-wrap: wrap; padding: 16px 16px;
    background: #fff; border-bottom: 1px solid #ffe0ee;
  }
  .filter-btn {
    padding: 7px 18px; border-radius: 40px;
    border: 1.5px solid #ffb3d1;
    background: transparent; color: #cc2266;
    font-size: 12px; font-family: 'DM Sans', sans-serif;
    cursor: pointer; transition: all 0.2s;
    letter-spacing: 0.2px; font-weight: 500;
  }
  .filter-btn:hover, .filter-btn.active {
    background: linear-gradient(135deg, #ff3f8e, #ff8c00);
    border-color: transparent; color: #fff; font-weight: 700;
  }

  /* ── GRID ── */
  .grid-container {
    max-width: 1200px; margin: 0 auto;
    padding: 32px 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 22px;
  }

  /* ── CARD ── */
  .card {
    background: #fff; border-radius: 20px;
    overflow: hidden;
    border: 1.5px solid #ffe0ee;
    transition: transform 0.3s, box-shadow 0.3s;
    position: relative;
    box-shadow: 0 2px 16px rgba(255,63,142,0.07);
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 16px 48px rgba(255,63,142,0.18);
  }
  .card.hidden { display: none; }

  /* ── PHOTO ── */
  .photo-wrap { position: relative; width: 100%; height: 560px; overflow: hidden; }
  .photo-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center center; display: block; }
  .photo-placeholder { display: flex; align-items: center; justify-content: center; color: #fff; font-family: 'Syne', sans-serif; font-size: 64px; font-weight: 800; }


  .card-name {
    font-family: 'Syne', sans-serif;
    font-size: 26px; font-weight: 800;
    color: #1a1a1a; line-height: 1; letter-spacing: -0.5px;
  }
  .meta-row { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.2px; padding: 3px 8px; border-radius: 20px;
  }
  .badge.age   { color: #ff3f8e; background: rgba(255,63,142,0.10); }
  .badge.city  { color: #e67e00; background: rgba(255,140,0,0.10); }
  .badge.conn  { color: #cc2266; background: rgba(204,34,102,0.08); }
  .mc-badge {
    position: absolute; top: 14px; right: 14px; z-index: 3;
    font-size: 9px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #ff3f8e, #ff8c00);
    color: #fff; padding: 3px 9px; border-radius: 20px;
    box-shadow: 0 2px 10px rgba(255,63,142,0.35);
  }

  /* ── CARD BODY ── */
  .card-body { padding: 16px 18px 0; }
  .narrator {
    font-size: 12.5px; color: #777;
    font-style: italic; line-height: 1.65;
    margin-bottom: 12px;
  }

  /* ── FACTS — no bullets, just spaced lines ── */
  .facts { display: none; }


  /* ── CARD BOTTOM ── */
  .card-bottom {
    padding: 12px 18px 14px;
    border-top: 1.5px solid #fff0f5;
    display: flex; align-items: center;
    justify-content: space-between; gap: 8px;
  }
  .phone {
    font-size: 13px; font-weight: 600;
    letter-spacing: 0.3px; color: #ff3f8e;
    font-variant-numeric: tabular-nums;
  }
  .save-btn {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.4px; text-transform: uppercase;
    padding: 6px 14px; border-radius: 40px; border: none;
    cursor: pointer; transition: all 0.2s;
    background: linear-gradient(135deg, #ff3f8e, #ff8c00);
    color: #fff;
  }
  .save-btn:hover { transform: scale(1.04); box-shadow: 0 3px 14px rgba(255,63,142,0.35); }
  .save-btn.saved { background: linear-gradient(135deg, #00c896, #00a67e); }

  /* ── FOOTER ── */
  .footer {
    text-align: center; padding: 28px 16px 44px;
    color: #ccc; font-size: 11.5px;
    font-style: italic; letter-spacing: 0.4px;
  }
</style>
</head>
<body>

const photos = {

  "Rose": "photos/rose.jpg",

};

// Store uploaded photos
const uploadedPhotos = {};

function buildCard(p) {
  const photoSrc = uploadedPhotos[p.name];
  const photoHTML = photoSrc
    ? `<div class="photo-wrap">
        <img src="${photoSrc}" alt="${p.name}" />
        ${p.mc?'<span class="mc-badge">⭐ Main Character</span>':''}
      </div>`
    : `<div class="photo-wrap photo-placeholder" style="background:${p.gradient};">
        <span style="font-size:64px;">${p.name[0]}</span>
        ${p.mc?'<span class="mc-badge">⭐ Main Character</span>':''}
      </div>`;

  return `
    <div class="card" data-tags="${p.tags.join(' ')}">
      <div style="position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#ff3f8e,#ff8c00);z-index:2;border-radius:20px 20px 0 0;"></div>
      ${photoHTML}
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="meta-row" style="margin-top:6px;margin-bottom:10px;">
          <span class="badge age">${p.age}</span>
          <span class="badge city">📍 ${p.city}</span>
          <span class="badge conn">${p.connection}</span>
        </div>
        <p class="narrator">"${p.narrator}"</p>
      </div>
      <div class="card-bottom">
        <span class="phone">${p.phone}</span>
        <button class="save-btn" onclick="saveContact(this,'${p.name}','${p.phone.replace(/\D/g,'')}')">Save Number</button>
      </div>
    </div>`;
}

function saveContact(btn, name, digits) {
  btn.textContent = '✓ Saved!';
  btn.classList.add('saved');
  setTimeout(()=>{ btn.textContent='Save Number'; btn.classList.remove('saved'); }, 2500);
  const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name} (Bombshells Only)\nTEL:+1${digits}\nEND:VCARD`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([vcard],{type:'text/vcard'}));
  a.download = `${name}_BombshellsOnly.vcf`;
  a.click();
}

function filter(tag, btn) {
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.card').forEach(c=>{
    c.classList.toggle('hidden', tag !== 'all' && !c.dataset.tags.includes(tag));
  });
}

function renderGrid() {
  document.getElementById('grid').innerHTML = data.map(buildCard).join('');
}

// Photo upload handler — exposed globally so Claude can call it
window.addPhoto = function(name, base64DataUrl) {
  uploadedPhotos[name] = base64DataUrl;
  renderGrid();
};

// Pre-populate uploadedPhotos from embedded photo data
Object.assign(uploadedPhotos, photos);
renderGrid();
